        // PRINCIPAL (Deber + Repaso) 30 preguntas
        const quizData = [
          { question: 'El átomo de silicio tiene 14 electrones, por lo que, en su configuración electrónica, diez electrones completan el primero y segundo nivel, de la siguiente manera: ______.  Los cuatro electrones restantes se ubican en el tercer nivel, repartidos en el orbital de s y p. Por lo tanto, la configuración electrónica del silicio es____________.', options: ['1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup> - 1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>3s<sup>2</sup>3p<sup>4</sup>', '1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup> - 1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>3s<sup>2</sup>3p<sup>2</sup>', '1s<sup>1</sup>2s<sup>1</sup>2p<sup>8</sup> - 1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>3s<sup>2</sup>3p<sup>2</sup>', '1s<sup>1</sup>2s<sup>3</sup>2p<sup>6</sup> - 1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>3s<sup>2</sup>3p<sup>2</sup>'], answer: '1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup> - 1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>3s<sup>2</sup>3p<sup>2</sup>', explanation: 'La configuración electrónica del silicio, que tiene 14 electrones, se expresa como 1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>3s<sup>2</sup>3p<sup>2</sup>. Esto indica que los primeros dos niveles están completamente llenos, mientras que en el tercer nivel hay cuatro electrones distribuidos en los orbitales s y p.', multi: 'OFF', maxSelect: 1 },
           { question: 'En la siguiente ilustración se muestra la distribución electrónica de dos elementos, un metal y un no metal. El metal corresponde al berilio y presenta un número atómico de 4, el no metal corresponde al nitrógeno con un número atómico de 7. <br> <img src="https://i.postimg.cc/dhprhSXT/Captura-de-pantalla-2026-11-04-161400.png" alt="Descripción de la imagen" width="400" height="100"> <br> Con base en la información, son características que describen a los elementos descritos, excepto:', options: ['En el nitrógeno, el último electrón presenta un número cuántico principal igual a 2.', 'En el berilio, el penúltimo electrón presenta un número cuántico de spin igual a +1/2.', 'El nitrógeno presenta 2 orbitales llenos y tres orbitales semillenos.', 'En el berilio, el último electrón presenta los siguientes números cuánticos: n=2; l=0; ml=-1; ms=+1/2.'], answer: 'En el berilio, el último electrón presenta los siguientes números cuánticos: n=2; l=0; ml=-1; ms=+1/2.', explanation: 'En el berilio (Z=4) la configuración es 1s<sup>2</sup>2s<sup>2</sup>. El último electrón está en el orbital 2s, por lo que ml debe ser 0 (no puede ser -1). Esa opción es incorrecta.', multi: 'OFF', maxSelect: 1 },
           { question: 'Los números cuánticos del último electrón en un átomo son: 4, 0, 0, +½. Si el número de neutrones excede en 3 al número de protones. Hallar el número másico.', options: ['41', '29', '19', '0'], answer: '41', explanation: '<br> <img src="https://i.postimg.cc/Y946NLJZ/Captura-de-pantalla-2026-11-05-113213.png" alt="Descripción de la imagen" width="700" height="500">.', multi: 'OFF', maxSelect: 1 },
           { question: 'El átomo de aluminio Al, presenta un número atómico de 13. Determine la configuración electrónica del Al<sup>+3</sup>.', options: ['1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>', '1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>3s<sup>2</sup>3p<sup>1</sup>', '1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>3s<sup>1</sup>', '1s<sup>2</sup>2s<sup>2</sup>2p<sup>2</sup>3s<sup>2</sup>'], answer: '1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>', explanation: 'La configuración electrónica del catión Al<sup>+3</sup> se obtiene al quitar tres electrones del aluminio neutro (número atómico 13), resultando en 1s<sup>2</sup>2s<sup>2</sup>2p<sup>6</sup>, ya que los electrones eliminados provienen del tercer nivel.', multi: 'OFF', maxSelect: 1 },
           { question: 'El paladio es un elemento químico, que se usa principalmente en convertidores catalíticos, así como también en joyería y odontología. Si su número atómico es de 46. Determine los electrones del último nivel.', options: ['20', '2', '15', '30'], answer: '2', explanation: '<br> <img src="https://i.postimg.cc/527QPNqX/Captura-de-pantalla-2026-11-05-113626.png" alt="Descripción de la imagen" width="500" height="100">.', multi: 'OFF', maxSelect: 1 },
           { question: 'El último electrón de un átomo presenta los siguientes números cuánticos: 4; 2; +2; +1/2. Determine los números cuánticos del último electrón para el catión divalente del átomo.', options: ['4; 2; 0; +1/2', '4; 2; +1; +1/2', '4; 2; +2; +1/2', '4; 2; -2; -1/2'], answer: '4; 2; 0; +1/2', explanation: 'Los números cuánticos del último electrón del catión divalente se ajustan a un estado donde se han perdido electrones, lo que cambia sus números cuánticos a 4;2;0;+1/2.', multi: 'OFF', maxSelect: 1 },
           { question: 'Si el número de neutrones de un átomo es igual a 30. Determine su número de masa, si su ion presenta una carga de +2 y el tercer nivel presenta 5 orbitales desapareados.', options: ['28', '30', '57', '32'], answer: '57', explanation: '<br> <img src="https://i.postimg.cc/BnkQL8BQ/Captura-de-pantalla-2026-11-05-113801.png" alt="Descripción de la imagen" width="550" height="300">.', multi: 'OFF', maxSelect: 1 },
           { question: 'Determine los cuatro números cuánticos para el último electrón de un átomo con 25 protones, 40 neutrones y 25 electrones.', options: ['3; 2; +2; +1/2', '3; 2; -2; +1/2', '2; 0; -2; +1/2', '3; 2; +2; -1/2'], answer: '3; 2; +2; +1/2', explanation: '<br> <img src="https://i.postimg.cc/25dRk3ck/Captura-de-pantalla-2026-11-05-114126.png" alt="Descripción de la imagen" width="550" height="300">.', multi: 'OFF', maxSelect: 1 },
           { question: 'La configuración electrónica consiste en la distribución de los electrones en sus niveles, subniveles y orbitales, basándose en el principio de Aufbau, la máxima multiplicidad Hund y el de exclusión de Pauli. Respecto a la distribución electrónica, indique la configuración que no cumpla con los principios mencionados.', options: ['1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup> 3p<sup>6</sup>', '1s<sup>2</sup> 2s<sup>2</sup> 2p<sub>x</sub><sup>2</sup> 2p<sub>y</sub><sup>2</sup> 2p<sub>z</sub><sup>2</sup>', '1s<sup>2</sup> 2s<sup>2</sup> 2p<sub>x</sub><sup>2</sup> 2p<sub>y</sub><sup>2</sup> 2p<sub>z</sub><sup>1</sup> 3s<sup>1</sup>', '1s<sup>2</sup> 2s<sup>2</sup> 2p<sub>x</sub><sup>1</sup> 2p<sub>y</sub><sup>1</sup> 2p<sub>z</sub><sup>1</sup>'], answer: '1s<sup>2</sup> 2s<sup>2</sup> 2p<sub>x</sub><sup>2</sup> 2p<sub>y</sub><sup>2</sup> 2p<sub>z</sub><sup>1</sup> 3s<sup>1</sup>', explanation: '<br> <img src="https://i.postimg.cc/KYDwXwzW/Captura-de-pantalla-2026-11-05-114228.png" alt="Descripción de la imagen" width="550" height="100">.', multi: 'OFF', maxSelect: 1 },
           { question: 'El fósforo es un no metal que se encuentra en la naturaleza en forma combinada como los fosfatos, pero nunca en estado fundamental. Es muy reactivo y se oxida espontáneamente en contacto con el oxígeno atmosférico emitiendo luz. Dicho elemento presenta 15 electrones, determine la cantidad de orbitales llenos y orbitales semillenos que posee.', options: ['6 y 3', '4 y 1', '3 y 1', '7 y 2'], answer: '6 y 3', explanation: '<br> <img src="https://i.postimg.cc/7LwtN99x/Captura-de-pantalla-2026-11-05-114358.png" alt="Descripción de la imagen" width="550" height="300">.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Qué número cuántico indica el nivel de energía de un electrón?', options: ['Número cuántico secundario', 'Número cuántico magnético', 'Número cuántico principal', 'Número cuántico de spin'], answer: 'Número cuántico principal', explanation: 'El número cuántico principal indica el nivel de energía en el que se encuentra un electrón dentro de un átomo, siendo fundamental para entender su ubicación.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Cuál es la fórmula para calcular el número máximo de electrones en un nivel de energía dado por n?', options: ['n<sup>2</sup>', '2n', '2n<sup>2</sup>', 'n<sup>2</sup>/2'], answer: '2n<sup>2</sup>', explanation: 'La fórmula 2n<sup>2</sup> se utiliza para calcular el número máximo de electrones en un nivel energético dado por n, reflejando cómo se distribuyen los electrones.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Qué valor puede tomar el número cuántico azimutal (l)?', options: ['Solo números enteros positivos', 'Números enteros desde 0 hasta n-1', 'Cualquier número real', 'Solo números negativos'], answer: 'Números enteros desde 0 hasta n-1', explanation: 'El número cuántico azimutal (l) puede tomar valores enteros desde 0 hasta n−1, lo cual es clave para definir la forma del orbital.', multi: 'OFF', maxSelect: 1 },
           { question: 'La estructura electrónica 1s<sup>2</sup>, 2s<sup>2</sup>, 2p<sup>6</sup>, 3s<sup>2</sup>, 3p<sup>5</sup> demuestra que el elemento:', options: ['Tiene 11 electrones', 'Tiene 2 electrones en el segundo nivel', 'Tiene dos electrones en el tercer nivel', 'Tiene 17 electrones'], answer: 'Tiene 17 electrones', explanation: 'Cada orbital contiene un número máximo de electrones. En el caso del orbital s: 2 electrones, del orbital p: 6 electrones. La suma de todos nos da el total de electrones que contiene un átomo, en este caso: 2+2+6+2+5 = 17 electrones.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Qué representa el número cuántico magnético (ml)?', options: ['El nivel de energía del electrón', 'La forma del orbital', 'La orientación espacial del orbital', 'El spin del electrón'], answer: 'La orientación espacial del orbital', explanation: 'El número cuántico magnético (ml) describe la orientación espacial del orbital donde se encuentra un electrón dentro de un subnivel.', multi: 'OFF', maxSelect: 1 },
           { question: 'Para un subnivel d, ¿cuál es el rango de valores que puede tomar el número cuántico magnético (ml)?', options: ['-1 a +1', '-2 a +2', '-3 a +3', '-2 a +2 y 0'], answer: '-2 a +2', explanation: 'Para un subnivel d, el rango de valores que puede tomar el número cuántico magnético (ml) es desde −2 hasta +2, lo cual determina las diferentes orientaciones posibles.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Qué número cuántico describe la dirección del giro de un electrón?', options: ['Número cuántico principal (n)', 'Número cuántico azimutal (l)', 'Número cuántico magnético (ml)', 'Número cuántico de spin (ms)'], answer: 'Número cuántico de spin (ms)', explanation: 'El número cuántico que describe la dirección del giro de un electrón es el número cuántico de spin (ms), fundamental para entender su comportamiento magnético.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Qué valor puede tomar el número cuántico de spin (ms)?', options: ['0 o 1', '+1/2 o -1/2', 'Solo 1', 'Solo -1'], answer: '+1/2 o -1/2', explanation: 'El número cuántico de spin (ms) puede tomar valores de +1/2 o −1/2, indicando la dirección del giro del electrón.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Cuál es la configuración electrónica del oxígeno (O Z:8)?', options: ['1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>4</sup>', '1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup>', '1s<sup>2</sup> 2s<sup>1</sup> 2p<sup>5</sup>', '1s<sup>2</sup> 3s<sup>2</sup> 3p<sup>4</sup>'], answer: '1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>4</sup>', explanation: 'La configuración electrónica del oxígeno es 1s<sup>2</sup>2s<sup>2</sup>2p<sup>4</sup>, reflejando cómo están distribuidos sus electrones en los niveles y subniveles energéticos.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Cuántos electrones puede albergar un subnivel p?', options: ['6', '8', '10', '14'], answer: '6', explanation: 'Un subnivel p puede albergar hasta seis electrones, lo cual es crucial para entender la capacidad máxima de los orbitales p.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Qué tipo de orbital tiene forma esférica?', options: ['s', 'p', 'd', 'f'], answer: 's', explanation: 'Los orbitales con forma esférica corresponden al tipo s, lo cual afecta cómo interactúan los electrones dentro del átomo.', multi: 'OFF', maxSelect: 1 },
           { question: 'Si un átomo tiene un número cuántico principal n = 3 y azimutal l = 0, ¿qué tipo de subnivel tiene?', options: ['s', 'p', 'd', 'f'], answer: 's', explanation: 'Un número cuántico principal n=3 y azimutal l=0 indican que estamos tratando con un subnivel s, determinando su forma y propiedades.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Cuál es el número máximo de electrones que pueden ocupar los subniveles d en un nivel dado?', options: ['10', '6', '14', '18'], answer: '10', explanation: 'En un subnivel d, el número máximo de electrones que pueden ocuparlo es diez, lo cual es esencial para comprender la química de transición.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Qué establece el principio de exclusión de Pauli?', options: ['Dos electrones no pueden tener los mismos cuatro números cuánticos en un átomo.', 'Los electrones deben ocupar orbitales vacíos antes de emparejarse.', 'Los electrones se comportan como ondas.', 'Los electrones giran en órbitas definidas.'], answer: 'Dos electrones no pueden tener los mismos cuatro números cuánticos en un átomo.', explanation: 'El principio de exclusión de Pauli establece que dos electrones no pueden tener los mismos cuatro números cuánticos en un átomo, regulando cómo se distribuyen los electrones.', multi: 'OFF', maxSelect: 1 },
           { question: 'En la configuración electrónica, ¿qué significa que un orbital esté "completo"?', options: ['Tiene su capacidad máxima de electrones ocupada.', 'No contiene electrones.', 'Tiene solo electrones con spin positivo.', 'Está en el estado más bajo de energía posible.'], answer: 'Tiene su capacidad máxima de electrones ocupada.', explanation: 'Un orbital "completo" significa que tiene su capacidad máxima ocupada por electrones, lo cual afecta las propiedades químicas del elemento.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Cuál es la configuración electrónica del hierro (Fe Z=26)?', options: ['[Ar]4s<sup>2</sup>3d<sup>6</sup>', '[Kr]5s<sup>2</sup>4d<sup>6</sup>', '[Ar]3d<sup>8</sup>4s<sup>0</sup>', '[Ar]4s<sup>0</sup>3d<sup>6</sup>'], answer: '[Ar]4s<sup>2</sup>3d<sup>6</sup>', explanation: 'La configuración electrónica del hierro (Fe) es [Ar]4s<sup>2</sup>3d<sup>6</sup>, mostrando cómo están distribuidos sus electrones en niveles energéticos específicos.', multi: 'OFF', maxSelect: 1 },
           { question: 'Determine los números cuánticos de un electrón en el subnivel, cuya configuración electrónica es 5d<sup>5</sup>.', options: ['(5, 2, 2, +1/2)', '(5, 2, 2, -1/2)', '(5, 2, 1, +1/2)', '(5, 2, 1, +1/2)'], answer: '(5, 2, 2, +1/2)', explanation: '<br> <img src="https://i.postimg.cc/kgKXSJ1v/Captura-de-pantalla-2026-11-05-115425.png" alt="Descripción de la imagen" width="550" height="400">.', multi: 'OFF', maxSelect: 1 },
           { question: 'Cuando un electrón se mueve a un nivel energético más alto, este proceso se llama:', options: ['Ionización', 'Excitación', 'Emisión', 'Absorción'], answer: 'Excitación', explanation: 'Cuando un electrón se mueve a un nivel energético más alto, este proceso se denomina excitación, reflejando cambios en su energía potencial.', multi: 'OFF', maxSelect: 1 },
           { question: 'En la regla de Hund, se establece que:', options: ['Los electrones deben emparejarse en orbitales ocupados antes de llenar los vacíos.', 'Los electrones ocuparán todos los orbitales disponibles antes de emparejarse en uno solo.', 'No puede haber dos electrones en un mismo orbital con el mismo spin.', 'Todos los orbitales deben estar llenos antes que uno nuevo sea ocupado.'], answer: 'Los electrones ocuparán todos los orbitales disponibles antes de emparejarse en uno solo.', explanation: 'En la regla de Hund, se establece que los electrones ocuparán todos los orbitales disponibles antes de emparejarse en uno solo, optimizando la estabilidad energética.', multi: 'OFF', maxSelect: 1 },
           { question: '¿Qué números cuánticos no es posible que existan?', options: ['(3, 3, 2, +1/2)', '(3, 2, 2, -1/2)', '(3, 2, 1, +1/2)', '(3, 2, 1, -1/2)'], answer: '(3, 3, 2, +1/2)', explanation: 'El número cuántico secundario (l) puede tener valores de 0 hasta n-1. Dado que n=3, l solo puede tomar valores menores a 3, no igual o mayor.', multi: 'OFF', maxSelect: 1 },
        ];

        // Práctica 20 preguntas
        const quizDataExtra = [
           { question: 'Un átomo con una configuración electrónica terminando en d<sup>4</sup> o d<sup>9</sup> es considerado:', options: ['Estable', 'Inestable', 'Neutro', 'Iónico'], answer: 'Inestable', explanation: 'Un átomo con una configuración electrónica terminando en d<sup>4</sup> o d<sup>9</sup> es considerado inestable debido a su tendencia a reorganizarse para alcanzar una mayor estabilidad energética.', multi: 'OFF', maxSelect: 1 },

            const hasGoodTld = /\.(com|es|net|org|edu|gov|mx|ar|co|uk|de|fr|it|pt|br|cl)$/i.test(domain);
            if (!hasGoodTld && !isTrusted) {
                return { valid: false, msg: 'Dominio poco común o sospechoso. Usa Gmail, Hotmail/Outlook, Yahoo, etc.' };
            }
            let analysisText = '';
            if (domain.includes('hotmail') || domain.includes('outlook') || domain.includes('live.com') || domain.includes('msn.com')) {
                analysisText = 'Análisis: proveedor Microsoft (Hotmail/Outlook) detectado · formato correcto · dominio legítimo';
            } else if (domain.includes('gmail') || domain.includes('googlemail')) {
                analysisText = 'Análisis: proveedor Google (Gmail) detectado · formato correcto · dominio legítimo';
            } else if (isTrusted) {
                analysisText = 'Análisis: proveedor conocido · formato correcto · dominio legítimo';
            } else {
                analysisText = 'Análisis: formato válido · dominio con TLD estándar · no se detectaron patrones de correo temporal';
            }
            return { valid: true, msg: analysisText };
        }

        function showSection(section, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            stopTimer();
            const app = document.getElementById('app');
            if (section === 'pdf') {
                app.innerHTML = `<div class="animate-fade-in"><h2 class="text-xl font-bold mb-4">📄 Pizarra Virtual</h2><div class="iframe-container"><iframe src="${DRIVE_PDF_URL}" width="100%" height="100%" allow="autoplay"></iframe></div></div>`;
            } else if (section === 'video') {
                app.innerHTML = `<div class="animate-fade-in"><h2 class="text-xl font-bold mb-4">🎥 Video Clase</h2><div class="iframe-container"><iframe src="${DRIVE_VIDEO_URL}" width="100%" height="100%" allow="autoplay"></iframe></div></div>`;
            }
        }

        function prepQuiz(mode, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            stopTimer();
            state = {
                currentMode: mode,
                view: 'quiz_home',
                studentName: '',
                studentEmail: '',
                activeQuestions: [],
                currentQuestion: 0,
                score: 0,
                selectedAnswer: null,
                isAnswerCorrect: null,
                emailStatus: null,
                emailAnalysis: null,
                emailAnalysisMsg: '',
                timeLeft: 0
            };
            render();
        }

        function startQuiz() {
            if (state.currentMode === 'deber') {
                state.activeQuestions = [...quizData];
            } else if (state.currentMode === 'evaluacion') {
                state.activeQuestions = [...quizData]
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 10);
            } else if (state.currentMode === 'extra') {
                state.activeQuestions = [...quizDataExtra];
            } else if (state.currentMode === 'evaluacion_final') {
                state.activeQuestions = [...quizDataEvaluacion];
            }
            state.view = 'name_input';
            state.emailAnalysis = null;
            state.emailAnalysisMsg = '';
            render();
        }

        function onEmailInput() {
            const e = document.getElementById('email-in');
            if (!e) return;
            const val = e.value.trim();
            if (val.length < 5) {
                state.emailAnalysis = null;
                state.emailAnalysisMsg = '';
                updateEmailUI();
                return;
            }
            state.emailAnalysis = 'checking';
            state.emailAnalysisMsg = 'Analizando correo…';
            updateEmailUI();
            clearTimeout(window._emailCheckTimer);
            window._emailCheckTimer = setTimeout(() => {
                const result = analyzeEmail(val);
                state.emailAnalysis = result.valid ? 'valid' : 'invalid';
                state.emailAnalysisMsg = result.msg;
                updateEmailUI();
            }, 600);
        }

        function updateEmailUI() {
            const feedback = document.getElementById('email-feedback');
            const analysis = document.getElementById('email-analysis');
            const input = document.getElementById('email-in');
            if (!feedback || !analysis || !input) return;
            if (state.emailAnalysis === 'checking') {
                feedback.innerHTML = `<span class="text-slate-500 text-sm flex items-center gap-2"><span class="dot-pulse">●</span> Verificando…</span>`;
                analysis.innerHTML = `<p class="text-xs text-slate-400 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            } else if (state.emailAnalysis === 'invalid') {
                feedback.innerHTML = `<span class="text-red-600 text-sm font-semibold">✗ Correo no válido o inexistente</span>`;
                analysis.innerHTML = `<p class="text-xs text-red-500/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-emerald-400', 'border-slate-300');
                input.classList.add('border-red-400');
            } else if (state.emailAnalysis === 'valid') {
                feedback.innerHTML = `<span class="text-emerald-600 text-sm font-semibold">✓ Correo aceptado</span>`;
                analysis.innerHTML = `<p class="text-xs text-emerald-600/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-slate-300');
                input.classList.add('border-emerald-400');
            } else {
                feedback.innerHTML = '';
                analysis.innerHTML = '';
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            }
        }

        function validaDatos() {
            const n = document.getElementById('name-in').value.trim();
            const e = document.getElementById('email-in').value.trim();
            if (n.length <= 2) {
                alert("Ingresa nombre completo (mínimo 3 caracteres).");
                return;
            }
            const result = analyzeEmail(e);
            state.emailAnalysis = result.valid ? 'valid' : 'invalid';
            state.emailAnalysisMsg = result.msg;
            updateEmailUI();
            if (!result.valid) return;
            state.studentName = n;
            state.studentEmail = e;
            state.view = 'playing';
            if (state.currentMode === 'evaluacion_final') {
                startTimer();
            }
            render();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function getTimerPhaseClass(remaining) {
            for (const phase of EVAL_TIMER_PHASES) {
                if (remaining >= phase.minSeconds) {
                    return phase.colorClass;
                }
            }
            return EVAL_TIMER_PHASES[EVAL_TIMER_PHASES.length - 1].colorClass;
        }

        function startTimer() {
            stopTimer();
            state.timeLeft = EVAL_TIMER_SECONDS;
            timerInterval = setInterval(() => {
                state.timeLeft--;
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    stopTimer();
                    state.view = 'results';
                    render();
                    enviarCorreo();
                    return;
                }
                const timerEl = document.getElementById('eval-timer');
                if (timerEl) {
                    timerEl.textContent = formatTime(state.timeLeft);
                    timerEl.className = `px-3 py-1.5 rounded-xl border-2 font-black text-sm tabular-nums ${getTimerPhaseClass(state.timeLeft)}`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function isMultiQuestion(q) {
            return q.multi === 'ON';
        }

        function arraysEqual(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b)) return false;
            if (a.length !== b.length) return false;
            const sa = [...a].sort();
            const sb = [...b].sort();
            return sa.every((v, i) => v === sb[i]);
        }

        function handleAnswer(idx) {
            if (state.isAnswerCorrect !== null) return;
            const currentQ = state.activeQuestions[state.currentQuestion];
            const option = currentQ.options[idx];

            if (isMultiQuestion(currentQ)) {
                let selected = Array.isArray(state.selectedAnswer) ? [...state.selectedAnswer] : [];
                const pos = selected.indexOf(option);
                if (pos > -1) {
                    selected.splice(pos, 1);
                } else {
                    if (selected.length >= currentQ.maxSelect) return;
                    selected.push(option);
                }
                state.selectedAnswer = selected;
                render();
            } else {
                if (state.selectedAnswer !== null) return;
                state.selectedAnswer = option;
                state.isAnswerCorrect = (option === currentQ.answer);
                if (state.isAnswerCorrect) state.score++;
                render();
                if (state.isAnswerCorrect) {
                    setTimeout(() => nextQuestion(), 1000);
                }
            }
        }

        function checkMultiAnswer() {
            if (state.isAnswerCorrect !== null) return;
            const currentQ = state.activeQuestions[state.currentQuestion];
            if (!isMultiQuestion(currentQ)) return;
            const selected = Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [];
            if (selected.length === 0) return;
            const correctAnswers = Array.isArray(currentQ.answer) ? currentQ.answer : [currentQ.answer];
            state.isAnswerCorrect = arraysEqual(selected, correctAnswers);
            if (state.isAnswerCorrect) state.score++;
            render();
            if (state.isAnswerCorrect) {
                setTimeout(() => nextQuestion(), 1000);
            }
        }

        function nextQuestion() {
            if (state.currentQuestion + 1 < state.activeQuestions.length) {
                state.currentQuestion++;
                state.selectedAnswer = null;
                state.isAnswerCorrect = null;
                render();
            } else {
                stopTimer();
                state.view = 'results';
                render();
                enviarCorreo();
            }
        }

        function enviarCorreo() {
            if (!state.studentEmail) return;
            state.emailStatus = 'sending';
            render();
            const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
            const totalQ = state.activeQuestions.length;
            let imageUrl = '';
            let mensaje = '';
            if (scorePerc >= 90) {
                imageUrl = 'https://img.icons8.com/color/128/medal2.png';
                mensaje = `¡Excelente trabajo, ${state.studentName}! Obtuviste un resultado sobresaliente.`;
            } else if (scorePerc >= 70) {
                imageUrl = 'https://img.icons8.com/color/128/diploma.png';
                mensaje = `¡Muy bien, ${state.studentName}! Has aprobado con un buen resultado.`;
            } else if (scorePerc >= 50) {
                imageUrl = 'https://img.icons8.com/color/128/ok.png';
                mensaje = `Buen esfuerzo, ${state.studentName}. Sigue practicando para mejorar.`;
            } else {
                imageUrl = 'https://img.icons8.com/color/128/error.png';
                mensaje = `Ánimo, ${state.studentName}. Revisa el material y vuelve a intentarlo.`;
            }
            const params = {
                to_name: state.studentName,
                to_email: state.studentEmail,
                score: scorePerc,
                correct_answers: state.score,
                total_questions: totalQ,
                mode_name: state.currentMode.toUpperCase(),
                image_url: imageUrl,
                mensaje: mensaje,
                fecha: new Date().toLocaleDateString('es-ES', {
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                })
            };
            emailjs.send("service_dhvsi72", "template_cy74x9h", params)
                .then(() => {
                    state.emailStatus = 'success';
                    render();
                })
                .catch((err) => {
                    console.error('Error EmailJS:', err);
                    state.emailStatus = 'error';
                    render();
                });
        }

        function render() {
            const app = document.getElementById('app');
           
            let modeTitle = '';
            let modeDesc = '';
            if (state.currentMode === 'deber') {
                modeTitle = '🧪 Deber';
                modeDesc = 'Resuelve las 30 preguntas del banco en orden.';
            } else if (state.currentMode === 'evaluacion') {
                modeTitle = '📝 Repaso';
                modeDesc = 'Prueba de 10 preguntas seleccionadas al azar.';
            } else if (state.currentMode === 'extra') {
                modeTitle = '📚 Práctica';
                modeDesc = 'Resuelve las 20 preguntas de la Práctica.';
            } else if (state.currentMode === 'evaluacion_final') {
                modeTitle = '📊 Evaluación';
                modeDesc = 'Resuelve las 16 preguntas de la Evaluación (tiempo límite: 16 min).';
            }
           
            if (state.view === 'quiz_home') {
                app.innerHTML = `
                <div class="text-center py-16 animate-fade-in bg-white rounded-[3rem] shadow-xl border">
                    <h2 class="text-4xl font-black text-slate-800 mb-2">${modeTitle}</h2>
                    <p class="text-slate-500 mb-8 text-lg">${modeDesc}</p>
                    <button onclick="startQuiz()" class="bg-emerald-600 text-white px-12 py-5 rounded-2xl font-black text-xl hover:bg-emerald-700 transition-all">
                        INICIAR
                    </button>
                </div>`;
            }

            if (state.view === 'name_input') {
                app.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-10 rounded-[2.5rem] shadow-2xl animate-fade-in">
                    <h2 class="text-2xl font-black mb-6 text-center">Registro de Estudiante</h2>
                    <input id="name-in" type="text" placeholder="Nombre y Apellido completo" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-4 focus:border-emerald-500 outline-none">
                   
                    <div class="relative mb-1">
                        <input id="email-in" type="email" placeholder="Correo para recibir nota (Gmail, Hotmail…)"
                               class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl focus:border-emerald-500 outline-none transition-colors"
                               oninput="onEmailInput()" onblur="onEmailInput()">
                    </div>
                   
                    <div id="email-feedback" class="min-h-[22px] mb-1"></div>
                    <div id="email-analysis" class="mb-5"></div>
                   
                    <button onclick="validaDatos()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition-all">
                        ENTRAR AL TEST
                    </button>
                    <p class="text-center text-[11px] text-slate-400 mt-4">Se verifica formato y se descartan correos temporales. No se envía nada hasta terminar el test.</p>
                </div>`;
                setTimeout(updateEmailUI, 50);
            }

            if (state.view === 'playing') {
                const q = state.activeQuestions[state.currentQuestion];
                const progress = ((state.currentQuestion + 1) / state.activeQuestions.length) * 100;
                const multi = isMultiQuestion(q);
                const selected = multi
                    ? (Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [])
                    : (state.selectedAnswer ? [state.selectedAnswer] : []);

                const multiHint = multi
                    ? `<p class="text-sm text-sky-600 font-semibold mb-4">
                         Selección múltiple · elige ${q.maxSelect} respuesta${q.maxSelect > 1 ? 's' : ''}
                         ${selected.length > 0 ? `(${selected.length}/${q.maxSelect})` : ''}
                       </p>`
                    : '';

                const timerHtml = (state.currentMode === 'evaluacion_final')
                    ? `<div id="eval-timer" class="px-3 py-1.5 rounded-xl border-2 font-black text-sm tabular-nums ${getTimerPhaseClass(state.timeLeft)}">
                           ${formatTime(state.timeLeft)}
                       </div>`
                    : '';

                app.innerHTML = `
                <div class="animate-fade-in">
                    <div class="flex justify-between items-center mb-6 px-4 gap-4">
                        <span class="font-black text-emerald-600">${state.currentQuestion + 1} / ${state.activeQuestions.length}</span>
                        <div class="flex-1 max-w-xs bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full transition-all" style="width:${progress}%"></div>
                        </div>
                        ${timerHtml}
                    </div>
                    <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border">
                        <h2 class="text-2xl font-bold text-slate-800 mb-2 leading-tight">${q.question}</h2>
                        ${multiHint}
                        <div class="grid gap-3">
                            ${q.options.map((opt, idx) => {
                                let style = "border-slate-100 bg-slate-50 hover:border-emerald-200";
                                const isSelected = selected.includes(opt);

                                if (state.isAnswerCorrect !== null) {
                                    if (multi) {
                                        const correctSet = Array.isArray(q.answer) ? q.answer : [q.answer];
                                        if (correctSet.includes(opt) && isSelected) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected && !correctSet.includes(opt)) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        } else if (correctSet.includes(opt) && !isSelected) {
                                            style = "border-emerald-300 bg-emerald-50 text-emerald-700";
                                        }
                                    } else {
                                        if (opt === q.answer) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        }
                                    }
                                } else if (isSelected) {
                                    if (multi) {
                                        style = "border-sky-400 bg-sky-100 text-sky-800";
                                    } else {
                                        style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                    }
                                }

                                return `<button onclick="handleAnswer(${idx})" 
                                            class="p-5 text-left border-2 rounded-xl font-bold transition-all ${style}">
                                            ${opt}
                                        </button>`;
                            }).join('')}
                        </div>

                        ${multi && state.isAnswerCorrect === null ? `
                            <button onclick="checkMultiAnswer()" 
                                class="mt-6 w-full py-4 rounded-xl font-bold transition-all
                                ${selected.length === q.maxSelect 
                                    ? 'bg-sky-600 text-white hover:bg-sky-700' 
                                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'}"
                                ${selected.length !== q.maxSelect ? 'disabled' : ''}>
                                Comprobar respuesta (${selected.length}/${q.maxSelect})
                            </button>
                        ` : ''}

                        ${state.selectedAnswer !== null && state.isAnswerCorrect === false ? `
                            <div class="mt-6 p-5 bg-amber-50 border border-amber-200 rounded-xl">
                                <p class="font-bold text-amber-800 mb-2">Explicación:</p>
                                <p class="text-slate-700">${q.explanation}</p>
                            </div>
                            <button onclick="nextQuestion()" class="mt-6 w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition-all">
                                Siguiente pregunta
                            </button>
                        ` : ''}
                    </div>
                </div>`;
            }

            if (state.view === 'results') {
                const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
                app.innerHTML = `
                <div class="max-w-md mx-auto text-center animate-fade-in bg-white p-12 rounded-[3rem] shadow-2xl">
                    <h2 class="text-2xl font-black mb-2">${state.studentName}</h2>
                    <p class="text-slate-400 uppercase text-xs font-bold mb-6">${state.currentMode}</p>
                    <div class="text-7xl font-black text-emerald-600 mb-4">${scorePerc}%</div>
                    <p class="text-lg font-bold text-slate-700 mb-10">${state.score} / ${state.activeQuestions.length} correctas</p>
                    <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">VOLVER AL INICIO</button>
                    <p class="mt-6 text-xs font-bold text-slate-400">
                        ${state.emailStatus === 'success' ? '✅ Nota e imagen enviadas al correo' :
                          state.emailStatus === 'error' ? '⚠️ Error al enviar nota e imagen' :
                          '⏳ Enviando nota e imagen al correo...'}
                    </p>
                </div>`;
            }
        }

        render();
    </script>
</body>
</html>
